<header class="site-header" data-header>

    <div class="container header-inner">

        <a href="{% url 'shop:home' %}" class="brand" aria-label="Shine Gallery">
            <span class="brand-mark">S</span>
            <span class="brand-name">SHINE</span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="ناوبری اصلی">
            <a href="{% url 'shop:home' %}">خانه</a>
            <a href="{% url 'shop:products' %}">فروشگاه</a>
            <a href="{% url 'shop:search' %}">جستجو</a>

            {% if user.is_authenticated %}
                <a href="{% url 'wishlist:list' %}">علاقه‌مندی‌ها</a>
                <a href="{% url 'orders:list' %}">سفارش‌ها</a>
            {% endif %}
        </nav>

        <div class="header-actions">

            {% if user.is_authenticated %}

                <a
                        href="{% url 'wishlist:list' %}"
                        class="header-icon header-count"
                        aria-label="علاقه‌مندی‌ها"
                >
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    {% if wishlist_count %}
                        <span>{{ wishlist_count }}</span>
                    {% endif %}
                </a>

                <a
                        href="{% url 'cart:detail' %}"
                        class="header-icon header-count"
                        aria-label="سبد خرید"
                >
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    {% if cart_count %}
                        <span>{{ cart_count }}</span>
                    {% endif %}
                </a>

                <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="header-account logout-btn">خروج</button>
                </form>

            {% else %}

                <a href="{% url 'accounts:login' %}" class="header-account">ورود</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-gold btn-sm">ثبت‌نام</a>

            {% endif %}

        </div>

        <button class="mobile-menu-btn" type="button" data-menu-toggle aria-label="باز کردن منو" aria-expanded="false"
                aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>
