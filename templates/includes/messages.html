{% if messages %}
    <div class="container messages-container" role="status" aria-live="polite">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">
                <span>{{ message }}</span>

                <button
                        type="button"
                        class="alert-close"
                        aria-label="بستن پیام"
                        data-alert-close
                >×
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
